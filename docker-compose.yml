# Docker Compose for Quant Agent
# Usage: docker-compose up -d

version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-agent-api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persist market data and strategies
      - ./data:/app/data
      - ./strategies:/app/strategies
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

