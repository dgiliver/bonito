# Weekly autonomous research — keeps symbol_strategies current, gated.
#
# Saturday after the trading week: refresh bars, re-run the per-symbol
# grid sweep with a ROLLING holdout, and adopt the new assignment bundle
# only if the account replay shows neither train nor holdout degrading
# (the same pre-registered criterion as manual experiments — see
# docs/EXPERIMENT_LOG.md). Rejected bundles change nothing and are
# retried next week. Every cycle commits an audit digest.
#
# Oversight without intervention: an issue is opened whenever the cycle
# ADOPTS or REJECTS a change (silent when unchanged), so the assignment
# history shows up as a notification feed. This workflow never touches
# mode, live_enabled, or risk caps — those stay human-only.

name: Weekly strategy research

on:
  schedule:
    - cron: "0 13 * * 6" # Saturday 13:00 UTC, markets closed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: livetrade-state
  cancel-in-progress: false

jobs:
  auto-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bonito
        run: pip install -e .

      - name: Refresh market data
        run: bonito live refresh

      - name: Run gated auto research
        run: bonito research auto --apply

      - name: Summarize digest
        id: digest
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json
          path = sorted(glob.glob("livetrade/research/auto_research_*.json"))[-1]
          d = json.load(open(path))
          print(f"outcome={d['outcome']}")
          bundle = f" via {d['adopted_bundle']}" if d.get("adopted_bundle") else ""
          lines = [
              f"Outcome: **{d['outcome'].upper()}**{bundle}",
              f"Windows: train {d['start'][:10]} → {d['holdout'][:10]}, "
              f"holdout {d['holdout'][:10]} → {d['end'][:10]} (rolling)",
              f"Assignments: +{d['added']} ~{d['updated']} -{d['removed']} | "
              f"benched {d.get('benched', [])} unbenched {d.get('unbenched', [])} | "
              f"default swap: {'YES → ' + str(d.get('default_swap')) if d.get('default_swapped') else 'no'}",
          ]
          for c in d.get("comparisons", []):
              lines.append(
                  f"- {c['window']}: Sharpe {c['baseline_sharpe']} → {c['candidate_sharpe']}, "
                  f"return {c['baseline_return']*100:+.1f}% → {c['candidate_return']*100:+.1f}%"
              )
          lines += [f"- gate: {r}" for r in d.get("reasons", [])]
          lines += [f"- ⚠️ {f}" for f in d.get("grid_edge_flags", [])]
          lines.append(f"Digest: `{path}`")
          body = "\\n".join(lines).replace("\n", "\\n")
          print(f"body={body}")
          EOF

      - name: Paper-vs-replay tracking check
        id: tracking
        run: |
          bonito live tracking
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json
          path = sorted(glob.glob("livetrade/research/tracking_*.json"))[-1]
          t = json.load(open(path))
          print(f"status={t['status']}")
          fill_bps = t.get("mean_abs_fill_bps")
          summary = (
              f"Tracking **{t['status']}**: {t['matched_fills']}/{t['paper_fills']} fills matched "
              f"(divergence {t['decision_divergence']:.0%}), mean fill gap "
              f"{fill_bps if fill_bps is not None else 'n/a'}bps, equity gap "
              f"{t['equity_gap_pct']:+.2f}% | " + "; ".join(t.get("reasons", []) or ["clean"])
          )
          print(f"summary={summary}")
          EOF

      - name: Commit research state
        run: |
          git config user.name "bonito-research-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add livetrade/research/ strategies/ config/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(research): weekly auto research $(date -u +%F) — ${{ steps.digest.outputs.outcome }}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      # Notifications are best-effort: a GitHub API hiccup (e.g. a graphql 504)
      # must never fail the research job itself. continue-on-error keeps the job
      # green if a notification can't be delivered; `|| echo 0` on each issue
      # LIST lets the step still attempt the create instead of aborting under
      # `bash -e`; and all dynamic text is passed via env (never spliced into the
      # shell through ${{ }}) so backticks/`$()` in a digest can't be executed.
      - name: Open visibility issue when assignments changed
        if: steps.digest.outputs.outcome != 'unchanged'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ steps.digest.outputs.body }}
          TRACKING_SUMMARY: ${{ steps.tracking.outputs.summary }}
          OUTCOME: ${{ steps.digest.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%b\n\n%s\n\nRun: %s\n' \
            "$ISSUE_BODY" "$TRACKING_SUMMARY" "$RUN_URL" > /tmp/issue_body.md
          gh issue create \
            --title "Weekly research $(date -u +%F): $OUTCOME" \
            --body-file /tmp/issue_body.md \
            || echo "::warning::could not create visibility issue"

      - name: Open issue on tracking WARN
        if: steps.tracking.outputs.status == 'WARN'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_SUMMARY: ${{ steps.tracking.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The simulation is no longer tracking reality — this gates trust
          # in every replay-based decision, so it gets its own alarm.
          existing=$(gh issue list --state open --search "Paper-vs-replay tracking WARN" \
            --json number --jq length || echo 0)
          if [ "$existing" = "0" ]; then
            printf '%s\n\nRun: %s\n' "$TRACKING_SUMMARY" "$RUN_URL" > /tmp/tracking_issue.md
            gh issue create \
              --title "Paper-vs-replay tracking WARN $(date -u +%F)" \
              --body-file /tmp/tracking_issue.md \
              || echo "::warning::could not create tracking issue"
          else
            echo "tracking issue already open — not spamming"
          fi

      - name: Open issue on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search "Weekly research failing" \
            --json number --jq length || echo 0)
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "Weekly research failing $(date -u +%F)" \
              --body "The weekly auto-research cycle failed. Logs: $RUN_URL

          Strategy assignments stay frozen at their last validated state until this is fixed or a cycle is run manually: \`bonito research auto --apply\`." \
              || echo "::warning::could not create failure issue"
          else
            echo "failure issue already open — not spamming"
          fi
