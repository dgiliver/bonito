name: Deploy Bonito Bot

on:
  push:
    branches: [main]
    paths:
      - 'src/bonito/trading/**'
      - 'scripts/run_bot.py'
      - 'strategies/deployed_strategy.json'
      - 'deploy/**'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:
    inputs:
      strategy_file:
        description: 'Strategy JSON file to deploy (relative path)'
        required: false
        default: 'strategies/deployed_strategy.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -x -q --ignore=tests/test_data_store.py -k "not test_full_flow_create_and_backtest_trailing"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='research_output' \
            --exclude='.env*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/bonito/

      - name: Setup and start bot on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Install Python 3.12 if not available
            if ! command -v python3.12 &> /dev/null; then
              echo "Installing Python 3.12..."
              sudo dnf install -y python3.12 python3.12-pip 2>/dev/null || \
              sudo yum install -y python3.12 python3.12-pip 2>/dev/null || \
              { echo "ERROR: Could not install Python 3.12"; exit 1; }
            fi
            echo "Python version: $(python3.12 --version)"

            cd /home/ec2-user/bonito

            # Setup venv if needed
            if [ ! -d .venv ]; then
              python3.12 -m venv .venv
            fi
            source .venv/bin/activate
            pip install -e "." boto3 --quiet

            # Use the startup template (already synced via rsync)
            # Template fetches secrets from AWS Secrets Manager at runtime
            cp deploy/start_bot.sh.template start_bot.sh
            chmod +x start_bot.sh

            # Install/update systemd service
            sudo cp deploy/bonito-bot.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable bonito-bot
            sudo systemctl restart bonito-bot

            # Verify
            sleep 5
            sudo systemctl status bonito-bot --no-pager || true
            echo "Deploy complete: $(date)"
